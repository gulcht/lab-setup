apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quests-tracker-repo-creds
  namespace: argocd
spec:
  refreshInterval: 5s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: quests-tracker-repo-creds
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/gulcht/lab-setup.git
        username: "{{ .githubUsername }}"
        password: "{{ .githubToken }}"
  data:
    - secretKey: githubToken
      remoteRef:
        key: argocd
        property: GITHUB_ACCESS_TOKEN
    - secretKey: githubUsername
      remoteRef:
        key: argocd
        property: GITHUB_USERNAME