apiVersion: apps/v1
kind: Deployment
metadata:
  name: quest-tracker-api
  namespace: quest-tracker-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quest-tracker-api
  template:
    metadata:
      labels:
        app: quest-tracker-api
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      initContainers:
        - name: db-migration
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - psql "$(DATABASE_URL)" -f /migrations/up.sql
          envFrom:
            - secretRef:
                name: api-secrets
          volumeMounts:
            - name: migration-script
              mountPath: /migrations
      containers:
        - name: api
          image: ghcr.io/gulcht/quests-tracker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
      volumes:
        - name: migration-script
          configMap:
            name: api-migration-db

