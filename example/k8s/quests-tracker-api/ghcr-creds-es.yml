apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-creds
  namespace: quest-tracker-app
spec:
  refreshInterval: 5s
  secretStoreRef:
    name: vault-secrets-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-creds
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .githubUsername }}",
                "password": "{{ .githubToken }}",
                "auth": "{{ printf "%s:%s" .githubUsername .githubToken | b64enc }}"
              }
            }
          }
  data:
    - secretKey: githubToken
      remoteRef:
        key: argocd
        property: GITHUB_ACCESS_TOKEN
    - secretKey: githubUsername
      remoteRef:
        key: argocd
        property: GITHUB_USERNAME
